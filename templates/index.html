<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Query Chatbot</title>
<style>
  body { font-family: sans-serif; background: #1f3a2e; display: flex; justify-content: center; padding: 30px; }
  .frame { width: 100%; max-width: 480px; background: #2c4d3c; border-radius: 8px; padding: 20px; }
  h1 { color: #f2ede1; text-align: center; font-size: 1.3rem; }
  #chat-window { height: 350px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; }
  .bot { align-self: flex-start; color: #f2ede1; border: 1px dashed #cfd6ce; }
  .user { align-self: flex-end; background: #3a5c48; color: #fff; }
  .input-row { display: flex; gap: 8px; margin-top: 10px; }
  #user-input { flex: 1; padding: 8px; border-radius: 6px; border: none; }
  button { padding: 8px 14px; border: none; border-radius: 6px; background: #e0a458; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="frame">
  <h1>Student Query Chatbot</h1>
  <div id="chat-window">
    <div class="msg bot">Hi! Ask me about courses, fees, timings, hostel, library, admissions. Type 'bye' to end.</div>
  </div>
  <div class="input-row">
    <input type="text" id="user-input" placeholder="Type your question...">
    <button id="send-btn">Send</button>
  </div>
</div>
<script>
  const chatWindow = document.getElementById("chat-window");
  const input = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";
    const response = await fetch("/get_response", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await response.json();
    addMessage(data.reply, "bot");
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
